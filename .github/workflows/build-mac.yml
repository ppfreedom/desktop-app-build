# macOS arm64 打包 workflow（手动触发，避免消耗额度）
name: build-mac

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 跳过 npm 层的 Electron 二进制下载（本平台是 macOS，electron-builder 会按需下载 darwin-arm64 并被下方缓存命中）
      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Build (typecheck + electron-vite build)
        run: npm run build

      - name: Package (zip, arm64, unsigned)
        run: npx electron-builder --mac zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder 在 CI 模式下构建 block map 时强制要求该变量，用内置只读 token 即可
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/*.zip
          retention-days: 7
