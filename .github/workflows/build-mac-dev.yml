# macOS arm64 调试包 workflow（纯内部排障，永不用于对抗测试）：
# - DEV_BUILD=1 → __DEV_BUILD__=true：连接后保持 360x56 状态胶囊可见、F12/Cmd+R 可用、
#   主进程事件落盘 userData/dev-debug.log（连接状态/截图指令耗时与字节数——诊断 TCC 静默故障）
# - 签名同生产（同一稳定自签证书）；appId 固定 org.headset.recorder.dev → dev 包屏幕录制
#   授权一次后跨构建持久，与生产包的授权记录（org.headset.recorder）互不干扰
# - productName 带 CI 短哈希（耳机录音器-dev-<sha7>）：区分装的是哪次构建，
#   /Applications 与「系统设置→屏幕录制」里一眼可辨
name: build-mac-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-dev"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 跳过 npm 层的 Electron 二进制下载（本平台是 macOS，electron-builder 会按需下载 darwin-arm64 并被下方缓存命中）
      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Build (typecheck + electron-vite build, DEV_BUILD=1)
        run: npm run build
        env:
          DEV_BUILD: "1"

      # 自签证书导入 + 加信任锚：electron-builder 的 CSC_LINK 路线对自签证书会因
      # CSSMERR_TP_NOT_TRUSTED（证书不在信任链）判「0 valid identities」拒签，
      # 故手工建 keychain 并 add-trusted-cert（自签证书做 TCC 稳定身份的标准做法）
      - name: Import self-signed signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          openssl pkcs12 -in signing.p12 -passin pass:"$P12_PASSWORD" -nokeys -out cert.pem 2>/dev/null
          security create-keychain -p ci-temp-password build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p ci-temp-password build.keychain-db
          security import signing.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain-db
          # 不做这步 codesign 读私钥会报 errSecInternalComponent
          security set-key-partition-list -S apple-tool:,apple: -k ci-temp-password build.keychain-db
          # 关键：把自签证书加为信任锚（仅 codeSign 策略），否则 find-identity 判 CSSMERR_TP_NOT_TRUSTED
          sudo security add-trusted-cert -d -r trustRoot -p codeSign cert.pem
          security list-keychain -d user -s build.keychain-db login.keychain-db
          security find-identity -v -p codesigning

      # appId 固定（TCC 稳定身份），productName 带 GITHUB_SHA 前 7 位（构建可辨识）
      - name: Package (zip, arm64, self-signed, dev identity)
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          npx electron-builder --mac zip --arm64 --publish never \
            --config.productName="耳机录音器-dev-${SHORT_SHA}" \
            --config.appId=org.headset.recorder.dev
        env:
          # 显式指定签名身份：避免自动发现拿到别的/拿不到
          CSC_NAME: Headset Recorder
          # electron-builder 在 CI 模式下构建 block map 时强制要求该变量，用内置只读 token 即可
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 自检：DR 必须是证书锚定（出现 cdhash 即签名失败、TCC 授权将随构建失效）
      - name: Verify code signature
        run: |
          APP=$(find dist -name "*.app" -maxdepth 2 | head -1)
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | tee /tmp/dr.txt
          grep -q cdhash /tmp/dr.txt && { echo "::error::DR 含 cdhash（未用证书签名），TCC 授权将失效"; exit 1; } || echo "签名身份稳定（证书锚定）"

      # zip 文件名不含 productName（用 ${name}），统一改名避免与生产 artifact 混淆
      - name: Rename artifact
        run: mv dist/*-mac.zip dist/mac-arm64-dev.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-dev
          path: dist/mac-arm64-dev.zip
          retention-days: 7
