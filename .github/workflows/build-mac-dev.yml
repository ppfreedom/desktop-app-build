# macOS arm64 调试包 workflow（与 build-mac.yml 平行，分开处理）：
# DEV_BUILD=1 构建注入 __DEV_BUILD__=true 编译期字面量——连接服务端后主窗口保持
# 可见（360x56 状态胶囊）且 F12/Cmd+R 调试快捷键不被拦截，供红队 mac 实机排障。
# 生产包的严格隐身行为只在 build-mac.yml 出的包里生效，两者互不影响。
name: build-mac-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-dev"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 跳过 npm 层的 Electron 二进制下载（本平台是 macOS，electron-builder 会按需下载 darwin-arm64 并被下方缓存命中）
      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ hashFiles('package-lock.json') }}

      - name: Build (typecheck + electron-vite build, DEV_BUILD=1)
        run: npm run build
        env:
          DEV_BUILD: "1"

      # extraMetadata 覆盖 productName：调试包命名为「截屏解题助手dev」，与生产包在同一台
      # mac 的 /Applications 下共存，调试时不会互相覆盖
      - name: Package (zip, arm64, unsigned, debug productName)
        run: npx electron-builder --mac zip --arm64 --publish never --config.extraMetadata.productName=截屏解题助手dev
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # electron-builder 在 CI 模式下构建 block map 时强制要求该变量，用内置只读 token 即可
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # artifactName 用 package.json 的 name（不受 productName 覆盖影响），重命名避免与生产 zip 混淆
      - name: Rename artifact
        run: mv dist/*-mac.zip dist/mac-arm64-dev.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-dev
          path: dist/mac-arm64-dev.zip
          retention-days: 7
